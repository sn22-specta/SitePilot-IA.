<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Agent IA Créateur de Site</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; color: #4a5568; }
        textarea {
            width: 100%;
            height: 110px;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            margin-top: 1rem;
            padding: 0.9rem 2rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover:not(:disabled) { background: #5568d3; }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        #status {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
        }
        #status.info { display: block; background: #ebf4ff; color: #2b6cb0; }
        #status.error { display: block; background: #fff5f5; color: #c53030; }
        #preview {
            margin-top: 2rem;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 1rem;
            min-height: 400px;
            background: #f7fafc;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Générateur de Site IA</h1>
        <p>Décrivez le site web que vous souhaitez créer :</p>
        <textarea id="prompt" placeholder="Ex: Crée une page de destination moderne pour une application de méditation, avec une section hero, des features et un formulaire d'inscription."></textarea>
        <button id="btn" onclick="generateWebsite()">✨ Générer le site</button>

        <div id="status"></div>
        <div id="preview">
            <p style="color:#718096; text-align:center;">Le site généré apparaîtra ici…</p>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const statusEl = document.getElementById('status');
        const previewDiv = document.getElementById('preview');

        function setStatus(msg, type = 'info') {
            statusEl.textContent = msg;
            statusEl.className = type;
        }

        function clearStatus() {
            statusEl.className = '';
            statusEl.textContent = '';
        }

        async function generateWebsite() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) {
                setStatus('Veuillez décrire le site que vous souhaitez créer.', 'error');
                return;
            }

            btn.disabled = true;
            setStatus('Génération en cours… ⏳ Cela peut prendre 30 à 60 secondes.', 'info');
            previewDiv.innerHTML = '<p style="color:#718096; text-align:center;">Génération en cours…</p>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    const message = data.error || `Erreur serveur (${response.status})`;
                    throw new Error(message);
                }

                if (!data.html) {
                    throw new Error('Réponse vide de l’IA.');
                }

                clearStatus();
                previewDiv.innerHTML = `<iframe srcdoc="${data.html.replace(/"/g, '&quot;')}" sandbox="allow-scripts allow-same-origin"></iframe>`;

            } catch (error) {
                console.error('Erreur complète :', error);
                setStatus('❌ ' + error.message, 'error');
                previewDiv.innerHTML = '<p style="color:#c53030; text-align:center;">Échec de la génération.</p>';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

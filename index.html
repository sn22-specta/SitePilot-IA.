<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Agent IA Créateur de Site</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background-color: #f4f4f9; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; }
        button { padding: 0.75rem 1.5rem; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #preview { margin-top: 2rem; border: 2px dashed #ccc; padding: 1rem; min-height: 300px; background-color: white; }
        iframe { width: 100%; height: 400px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>🤖 Générateur de Site IA</h1>
    <p>Décrivez le site web que vous souhaitez créer :</p>
    <textarea id="prompt" placeholder="Ex: Crée une page de destination pour une application de méditation..."></textarea>
    <button onclick="generateWebsite()">✨ Générer le site</button>

    <div id="preview">
        <p>Le site généré apparaîtra ici...</p>
    </div>

    <script>
        // ⚠️ Remplacez par votre clé API OpenAI
        const OPENAI_API_KEY = 'VOTRE_CLE_API_ICI'; 

        async function generateWebsite() {
            const prompt = document.getElementById('prompt').value;
            const previewDiv = document.getElementById('preview');
            if (!prompt) {
                alert('Veuillez décrire le site que vous souhaitez créer.');
                return;
            }

            previewDiv.innerHTML = '<p>Génération en cours... ⏳</p>';

            // Le "system prompt" définit le rôle de l'IA
            const systemPrompt = `Tu es un développeur web expert. Génère uniquement le code HTML et CSS complet, dans un seul fichier, en te basant sur la demande de l'utilisateur. Utilise un design moderne et responsive. Ne fournis aucun texte explicatif, seulement le code.`;
            
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o', // Ou un modèle plus récent comme gpt-5-mini
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erreur API: ${response.statusText}`);
                }

                const data = await response.json();
                const generatedCode = data.choices[0].message.content;

                // Nettoie la réponse pour ne garder que le code HTML (parfois l'IA ajoute des explications)
                const htmlContent = generatedCode.replace(/```html\n?/g, '').replace(/```\n?/g, '').trim();

                // Affiche le code généré dans un iframe pour une prévisualisation sécurisée
                previewDiv.innerHTML = `<iframe srcdoc="${htmlContent.replace(/"/g, '&quot;')}"></iframe>`;

            } catch (error) {
                console.error('Erreur:', error);
                previewDiv.innerHTML = `<p style="color: red;">Une erreur est survenue : ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>

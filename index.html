<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Agent Prompt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .app { width: 100%; max-width: 640px; background: #1e293b; border-radius: 20px; padding: 2rem;
               box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; margin-bottom: 1rem;
             background: linear-gradient(135deg, #60a5fa, #a78bfa);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        select, textarea { width: 100%; padding: 0.9rem; border: 2px solid #334155; border-radius: 10px;
                           background: #0f172a; color: #e2e8f0; font-family: inherit; font-size: 0.95rem;
                           margin-bottom: 1rem; }
        textarea { min-height: 80px; resize: vertical; }
        button { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #60a5fa, #a78bfa);
                 color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
                 cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .result { margin-top: 1.5rem; padding: 1.2rem; background: #0f172a; border: 2px solid #334155;
                  border-radius: 10px; white-space: pre-wrap; line-height: 1.6; display: none; }
        .result.show { display: block; }
        .result.error { border-color: #ef4444; color: #fca5a5; }
    </style>
</head>
<body>
    <div class="app">
        <h1>✨ Améliorateur de prompt</h1>
        <select id="type">
            <option>💬 Texte (ChatGPT, Claude…)</option>
            <option>💻 Code / Développement</option>
            <option>🎨 Image (Midjourney, DALL·E…)</option>
            <option>📣 Marketing / Rédaction</option>
        </select>
        <textarea id="idea" placeholder="Décris ton idée en quelques mots…"></textarea>
        <button id="btn" onclick="improve()">🚀 Améliorer le prompt</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        // ⚠️ Remplace par ta clé Groq (gsk_...)
        const GROQ_API_KEY = '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';

        async function improve() {
            const idea = document.getElementById('idea').value.trim();
            const type = document.getElementById('type').value;
            const btn = document.getElementById('btn');
            const resultEl = document.getElementById('result');

            if (!idea) {
                resultEl.className = 'result show error';
                resultEl.textContent = '❌ Décris d’abord ton idée.';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Génération…';
            resultEl.className = 'result show';
            resultEl.textContent = 'Génération en cours…';

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-oss-20b',
                        messages: [
                            { role: 'system', content: 'Tu es un expert en prompt engineering. Transforme une idée vague en un prompt clair, précis et structuré. Réponds UNIQUEMENT avec le prompt final, sans introduction.' },
                            { role: 'user', content: `Type : ${type}\nIdée : ${idea}\n\nÉcris un prompt optimisé (max 200 mots).` }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || `Erreur (${res.status})`);

                const prompt = data.choices?.[0]?.message?.content?.trim();
                if (!prompt) throw new Error('Réponse vide.');

                resultEl.textContent = prompt;

            } catch (e) {
                resultEl.className = 'result show error';
                resultEl.textContent = '❌ ' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Améliorer le prompt';
            }
        }
    </script>
</body>
</html>

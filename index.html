<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Agent Prompt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .app {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }
        textarea, select {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea { min-height: 80px; }
        textarea:focus, select:focus { outline: none; border-color: #60a5fa; }
        select { margin-bottom: 1rem; cursor: pointer; }
        button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover:not(:disabled) { opacity: 0.9; }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            min-height: 80px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }
        .result.show { display: block; }
        .result.error { border-color: #ef4444; color: #fca5a5; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #334155;
        }
        .result-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .copy-btn {
            width: auto;
            margin: 0;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            background: #334155;
        }
        .copy-btn:hover { background: #475569; }
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #334155;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app">
        <h1>✨ Améliorateur de prompt</h1>
        <p class="sub">Décris ton idée, je la transforme en prompt pro.</p>

        <label for="type">Type de prompt</label>
        <select id="type">
            <option value="Texte / ChatGPT">💬 Texte (ChatGPT, Claude…)</option>
            <option value="Code / Développement">💻 Code / Développement</option>
            <option value="Image / Midjourney">🎨 Image (Midjourney, DALL·E…)</option>
            <option value="Vidéo / Runway">🎬 Vidéo (Runway, Sora…)</option>
            <option value="Marketing / Rédaction">📣 Marketing / Rédaction</option>
        </select>

        <label for="idea">Ton idée en quelques mots</label>
        <textarea id="idea" placeholder="Ex : un site pour vendre des chaussures de running éco-responsables"></textarea>

        <button id="btn" onclick="improve()">🚀 Améliorer le prompt</button>

        <div id="result" class="result"></div>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const resultEl = document.getElementById('result');

        async function improve() {
            const idea = document.getElementById('idea').value.trim();
            const type = document.getElementById('type').value;

            if (!idea) {
                showError('Décris d’abord ton idée.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Génération…';
            resultEl.className = 'result';
            resultEl.textContent = '';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idea, type })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) throw new Error(data.error || `Erreur (${res.status})`);
                if (!data.prompt) throw new Error('Réponse vide.');

                showResult(data.prompt);

            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Améliorer le prompt';
            }
        }

        function showResult(prompt) {
            resultEl.className = 'result show';
            resultEl.innerHTML = `
                <div class="result-header">
                    <span class="result-title">✨ Prompt amélioré</span>
                    <button class="copy-btn" onclick="copyPrompt()">Copier</button>
                </div>
                <div id="prompt-text"></div>
            `;
            document.getElementById('prompt-text').textContent = prompt;
        }

        function showError(msg) {
            resultEl.className = 'result show error';
            resultEl.textContent = '❌ ' + msg;
        }

        function copyPrompt() {
            const text = document.getElementById('prompt-text')?.textContent || '';
            navigator.clipboard.writeText(text).then(() => {
                const btnCopy = document.querySelector('.copy-btn');
                btnCopy.textContent = '✓ Copié !';
                setTimeout(() => btnCopy.textContent = 'Copier', 1500);
            });
        }

        // Entrée = Ctrl+Entrée pour lancer
        document.getElementById('idea').addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) improve();
        });
    </script>
</body>
</html>

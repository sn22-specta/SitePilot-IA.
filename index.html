
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>SitePilot IA</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --panel: #121c30;
  --border: #2a3852;
  --text: #f4f7ff;
  --muted: #a7b4cc;
  --blue: #5685ff;
  --cyan: #55d6d0;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px;
  background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, sans-serif;
}
main { max-width: 950px; margin: auto; }
h1 span { color: var(--cyan); }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; margin: 18px 0;
}
label { display: block; margin: 14px 0 6px; }
input, select, textarea, button {
  width: 100%; padding: 12px; border-radius: 9px;
  border: 1px solid var(--border); font: inherit;
}
input, select, textarea {
  background: var(--bg); color: var(--text);
}
textarea { min-height: 110px; resize: vertical; }
button {
  margin-top: 16px; background: var(--blue);
  color: white; border: 0; font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: .6; }
#status { color: var(--muted); overflow-wrap: anywhere; }
iframe {
  width: 100%; height: 480px; background: white;
  border: 1px solid var(--border); border-radius: 10px;
}
pre, #output {
  white-space: pre-wrap; overflow-wrap: anywhere;
}
#output {
  min-height: 160px; padding: 14px;
  background: var(--bg); border-radius: 10px;
}
</style>
</head>
<body>
<main>
  <h1>SitePilot <span>IA</span></h1>
  <p>Décris ton projet. Gemini t'aidera à concevoir ton site web.</p>

  <section class="card">
    <form id="form">
      <label for="name">Nom du projet</label>
      <input id="name" required maxlength="100"
        placeholder="Ex. : Boutique Sénégal">

      <label for="type">Type de projet</label>
      <select id="type">
        <option>Site vitrine</option>
        <option>Commerce en ligne</option>
        <option>Blog</option>
        <option>Application web</option>
        <option>Plateforme éducative</option>
        <option>Agent IA</option>
      </select>

      <label for="description">Décris le site que tu veux créer</label>
      <textarea id="description" required maxlength="5000"
        placeholder="Pages, couleurs, fonctionnalités, public cible..."></textarea>

      <label for="mode">Action</label>
      <select id="mode">
        <option value="generate">Générer un site HTML</option>
        <option value="plan">Analyser et planifier</option>
        <option value="revise">Améliorer un code HTML</option>
      </select>

      <label for="existing">Code HTML existant (facultatif)</label>
      <textarea id="existing" maxlength="25000"
        placeholder="Colle le code à améliorer ici."></textarea>

      <button id="submit" type="submit">Créer avec Gemini</button>
      <p id="status" role="status" aria-live="polite">Prêt.</p>
    </form>
  </section>

  <section class="card">
    <h2>Résultat de Gemini</h2>
    <pre id="output">Ton résultat apparaîtra ici.</pre>
    <button id="download" type="button">Télécharger index.html</button>
  </section>

  <section class="card">
    <h2>Aperçu du site</h2>
    <iframe id="preview" title="Aperçu du site généré"
      sandbox=""
      referrerpolicy="no-referrer"
      srcdoc="<!doctype html><html lang='fr'><body style='font-family:system-ui;padding:24px'><h2>Bienvenue sur SitePilot</h2><p>Ton site apparaîtra ici.</p></body></html>"></iframe>
  </section>
</main>

<script>
"use strict";

// API hébergée sur Vercel : aucune URL Cloudflare.
const API_URL = "/api/generate";

const form = document.getElementById("form");
const button = document.getElementById("submit");
const statusBox = document.getElementById("status");
const output = document.getElementById("output");
const preview = document.getElementById("preview");

let generatedHtml = "";

function cleanHtml(text) {
  let html = text.trim()
    .replace(/^```(?:html)?\s*/i, "")
    .replace(/\s*```$/, "")
    .trim();

  const start = html.toLowerCase().indexOf("<!doctype html");
  if (start >= 0) html = html.slice(start);

  return html;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const type = document.getElementById("type").value;
  const description =
    document.getElementById("description").value.trim();
  const mode = document.getElementById("mode").value;
  const existing =
    document.getElementById("existing").value.trim();

  if (!name || !description) {
    statusBox.textContent = "Complète les champs obligatoires.";
    return;
  }

  if (mode === "revise" && !existing) {
    statusBox.textContent = "Colle le HTML à améliorer.";
    return;
  }

  const mission = [
    "Tu es SitePilot IA, expert en création web.",
    "Réponds en français.",
    "Nom : " + name,
    "Type : " + type,
    "Description : " + description,
    mode === "plan"
      ? "Fournis un plan concret, les pages, les fonctions, les technologies, les étapes et les tests."
      : mode === "revise"
        ? "Améliore le HTML fourni. Retourne le document HTML complet uniquement, sans Markdown.\nHTML :\n" + existing
        : "Génère un document HTML complet, responsive, avec CSS et JavaScript intégrés. Retourne uniquement le HTML, sans Markdown. N'inclus aucun secret et n'invente pas de backend fonctionnel."
  ].join("\n\n");

  button.disabled = true;
  button.textContent = "Génération en cours...";
  statusBox.textContent = "Connexion à Gemini...";
  output.textContent = "";
  generatedHtml = "";

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 85000);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mission, mode }),
      signal: controller.signal
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.erreur || "Erreur HTTP " + response.status);
    }

    const text = typeof data.reponse === "string"
      ? data.reponse
      : "";

    if (!text) throw new Error("Réponse Gemini vide.");

    if (mode === "plan") {
      output.textContent = text;
      statusBox.textContent = "Analyse terminée.";
    } else {
      const html = cleanHtml(text);

      if (!/<html[\s>]/i.test(html) ||
          !/<body[\s>]/i.test(html)) {
        throw new Error("Le résultat n'est pas un document HTML complet.");
      }

      generatedHtml = html;
      output.textContent = html;
      preview.srcdoc = html;
      statusBox.textContent =
        "Site généré. Vérifie son aperçu avant publication.";
    }
  } catch (error) {
    statusBox.textContent =
      error.name === "AbortError"
        ? "Délai dépassé. Réessaie."
        : error.message || "Erreur de connexion à l'API Vercel.";
  } finally {
    clearTimeout(timeout);
    button.disabled = false;
    button.textContent = "Créer avec Gemini";
  }
});

document.getElementById("download").addEventListener("click", () => {
  if (!generatedHtml) {
    statusBox.textContent = "Génère d'abord un site HTML.";
    return;
  }

  const blob = new Blob([generatedHtml], {
    type: "text/html;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "index.html";
  link.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
